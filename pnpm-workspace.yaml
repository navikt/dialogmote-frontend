allowBuilds:
  esbuild: true
  lefthook: false
  msw: true
  protobufjs: true
  sharp: true

minimumReleaseAge: 4320
# Verified release required for the Dialogmøte survey rollout.
minimumReleaseAgeExclude:
  - "@navikt/lumi-survey@2.2.1"
blockExoticSubdeps: true

# GitHub Packages omits @nais/apm's optional-peer metadata. The app uses the
# root browser API, not the optional React adapter.
overrides:
  "@nais/apm@0.6.0>@grafana/faro-react": "-"
  "@nais/apm@0.6.0>react-router": "-"
  "@nais/apm@0.6.0>react-router-dom": "-"
